<body>
  <canvas id="network-canvas"></canvas>
  <div class="content-wrapper">
    <div class="container">
      <div class="logo">Agention.ai</div>
      <div class="tagline">The Future of Agentic AI Development</div>
      <div class="description">
        At Agention.ai we build intelligent AI agents to accelerate human
        scientific discovery.
      </div>
      <div class="coming-soon">Coming Soon</div>
      <div class="orb-container">
        <div class="orb"></div>
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
      </div>
      <div class="footer">
        <a href="mailto:contact@agention.ai">contact@agention.ai</a>
      </div>
    </div>
  </div>
  <script>
    // Existing JavaScript for orb randomization
    const orb = document.querySelector(".orb");

    function randomizeOrb() {
      const radius1 = Math.random() * 20 + 40;
      const radius2 = Math.random() * 20 + 40;
      const radius3 = Math.random() * 20 + 40;
      const radius4 = Math.random() * 20 + 40;
      orb.style.borderRadius = `${radius1}% ${radius2}% ${radius3}% ${radius4}% / 50% 50% 50% 50%`;

      const scale = 1 + Math.random() * 0.2;
      orb.style.transform = `scale(${scale})`;

      const duration = 2 + Math.random() * 2;
      orb.style.animationDuration = `${duration}s`;
    }

    randomizeOrb();
    orb.addEventListener("animationiteration", randomizeOrb);

    // New JavaScript for the network background
    const canvas = document.getElementById("network-canvas");
    const ctx = canvas.getContext("2d");
    let nodes = [];
    const numNodes = 20; // Number of nodes (agents)

    // Set canvas size
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // Node class to represent agents
    class Node {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 3 + 2; // Size between 2 and 5
        this.vx = (Math.random() - 0.5) * 0.5; // Slow movement
        this.vy = (Math.random() - 0.5) * 0.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Bounce off edges
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(79, 172, 254, 0.5)";
        ctx.fill();
      }
    }

    // Initialize nodes
    for (let i = 0; i < numNodes; i++) {
      nodes.push(new Node());
    }

    // Animation loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Update and draw nodes
      nodes.forEach((node) => {
        node.update();
        node.draw();
      });

      // Draw connections between nodes (workflows)
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 150) {
            // Connect if nodes are close
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.strokeStyle = `rgba(0, 242, 254, ${1 - distance / 150})`; // Fade with distance
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
